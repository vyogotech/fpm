# Shared policy for every location that serves the fpm repository.
#
# This file exists because of two nginx inheritance rules that are easy to get
# wrong, and were both got wrong before:
#
#   1. `limit_except` is NOT inherited into a nested location. A nested
#      location without its own `limit_except` is unauthenticated, even when
#      its parent has one.
#
#   2. A location that declares ANY `add_header` discards every `add_header`
#      inherited from its parent. Declaring `Content-Type` in a nested location
#      therefore silently drops the parent's CORS headers.
#
# Both rules mean this policy cannot be set once on the parent `location /` and
# relied upon. Every location that serves repository content must `include`
# this file explicitly.
#
# Enforced by test/registry/registry_auth_test.go — see
# test/registry/features/registry_auth.feature for the behaviour it locks down.

# Reads are public; every write requires a publisher credential.
limit_except GET OPTIONS {
    auth_basic "FPM Repository - Authentication Required";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

add_header 'Access-Control-Allow-Origin' '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

# CORS preflight. `return` inside `if` is one of the two uses that are safe in
# location context.
if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
    add_header 'Access-Control-Max-Age' 1728000;
    add_header 'Content-Type' 'text/plain charset=UTF-8';
    add_header 'Content-Length' 0;
    return 204;
}
