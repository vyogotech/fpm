user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add custom MIME type for .fpm files
    types {
        application/x-fpm fpm;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Increase buffer sizes for large file uploads
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Root location for repository
        #
        # Every location below includes fpm-location.conf, which carries the
        # auth and CORS policy. Read that file before changing any of them:
        # neither `limit_except` nor `add_header` inherits the way it looks
        # like it should, so the policy has to be repeated per location.
        location / {
            root /var/fpm-repo;

            # Enable directory listing
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            # Enable WebDAV methods. COPY and MOVE are deliberately absent —
            # the fpm client never issues them, so they are pure attack
            # surface. These are inherited by the nested locations below.
            dav_methods PUT DELETE MKCOL;

            # Automatically create directories
            create_full_put_path on;
            dav_access user:rw group:r all:r;

            include /etc/nginx/fpm-location.conf;

            # Ensure proper handling of .fpm files.
            #
            # This location governs artifact writes at EVERY path depth. A
            # server-level regex cannot be used to protect them: when a nested
            # location matches, nginx returns from ngx_http_core_find_location
            # immediately and never evaluates server-level regex locations. An
            # earlier revision had exactly such a server-level rule and it was
            # dead code, leaving every artifact PUT unauthenticated.
            location ~ \.fpm$ {
                include /etc/nginx/fpm-location.conf;

                add_header Content-Type application/x-fpm;
                add_header Content-Disposition 'attachment';
            }

            # Metadata files - JSON format.
            #
            # package-metadata.json carries fpm_path and checksum_sha256, so an
            # anonymous writer here could repoint any package at any artifact
            # and forge its checksum; index.json governs the whole catalogue.
            location ~ /metadata/.*\.json$ {
                include /etc/nginx/fpm-location.conf;

                add_header Content-Type application/json;
            }
        }
    }
}

