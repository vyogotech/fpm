user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Add custom MIME type for .fpm files
    types {
        application/x-fpm fpm;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Increase buffer sizes for large file uploads
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Root location for repository
        location / {
            root /var/fpm-repo;
            
            # Enable directory listing
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            # Enable WebDAV methods
            dav_methods PUT DELETE MKCOL COPY MOVE;
            
            # Automatically create directories
            create_full_put_path on;
            dav_access user:rw group:r all:r;

            # Disable auth for GET requests (public read)
            limit_except GET OPTIONS {
                auth_basic "FPM Repository - Authentication Required";
                auth_basic_user_file /etc/nginx/.htpasswd;
            }

            # CORS headers for cross-origin requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            # Handle OPTIONS method for CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Ensure proper handling of .fpm files
            location ~ \.fpm$ {
                add_header Content-Type application/x-fpm;
                add_header Content-Disposition 'attachment';
            }

            # Metadata files - JSON format
            location ~ /metadata/.*\.json$ {
                add_header Content-Type application/json;
                
                # Allow PUT for metadata updates
                dav_methods PUT DELETE MKCOL;
                create_full_put_path on;
                dav_access user:rw group:r all:r;

                # TODO: Add authentication once FPM supports credentials in repo config
                # For now, allow public write for testing
                # limit_except GET OPTIONS {
                #     auth_basic "FPM Repository - Authentication Required";
                #     auth_basic_user_file /etc/nginx/.htpasswd;
                # }
            }
        }

        # Specific location for packages (redundant but explicit)
        location ~ ^/[^/]+/[^/]+/[^/]+/.*\.fpm$ {
            root /var/fpm-repo;
            
            dav_methods PUT DELETE MKCOL;
            create_full_put_path on;
            dav_access user:rw group:r all:r;

            limit_except GET OPTIONS {
                auth_basic "FPM Repository - Authentication Required";
                auth_basic_user_file /etc/nginx/.htpasswd;
            }

            add_header Content-Type application/x-fpm;
            add_header Content-Disposition 'attachment';
        }
    }
}

