name: FPM Catalog Mirror & GHCR Prepopulation

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated catalog slugs to restrict run to (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Perform a dry-run without building or publishing'
        type: boolean
        default: false
      allow_third_party:
        description: 'Include third-party apps in catalog'
        type: boolean
        default: true
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read
  packages: write

jobs:
  mirror-to-ghcr:
    name: Mirror Catalog to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip wheel
          npm install -g yarn

      - name: Restore Persistent Build & Package Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.fpm/build-cache
            ~/.fpm/apps
            dist
          key: ${{ runner.os }}-fpm-mirror-${{ hashFiles('catalog/apps.csv') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fpm-mirror-${{ hashFiles('catalog/apps.csv') }}-
            ${{ runner.os }}-fpm-mirror-

      - name: Build FPM CLI
        run: make build

      - name: Configure GHCR OCI Repository
        run: |
          ./bin/fpm repo add ghcr ghcr.io/${{ github.repository }} --type oci --username ${{ github.actor }}
          ./bin/fpm repo list

      - name: Run FPM Mirror
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          ARGS="--repo ghcr --catalog catalog/apps.csv --cache-dir ~/.fpm/build-cache --output-path dist --report dist/mirror-report.json"
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          if [ -n "${{ inputs.apps }}" ]; then
            ARGS="$ARGS --apps ${{ inputs.apps }}"
          fi
          
          if [ "${{ inputs.allow_third_party }}" = "false" ]; then
            ARGS="$ARGS --allow-third-party=false"
          fi

          echo "Running: ./bin/fpm mirror $ARGS"
          ./bin/fpm mirror $ARGS

      - name: Upload Mirror Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpm-mirror-report
          path: dist/mirror-report.json
          if-no-files-found: ignore
          retention-days: 14
