name: FPM Catalog Mirror & GHCR Prepopulation

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated catalog slugs to restrict run to (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Perform a dry-run without building or publishing'
        type: boolean
        default: false
      allow_third_party:
        description: 'Also build catalog entries outside the frappe GitHub org'
        type: boolean
        default: false
      build_from_source:
        description: 'Compile the CLI from this branch instead of using the latest release (for validating an unreleased change)'
        type: boolean
        default: false
  schedule:
    # Daily at 02:00 UTC. Re-runs are idempotent — the plan queries the registries and
    # skips versions they already have — so most days a shard only fetches tags and exits.
    #
    # Note: GitHub only schedules workflows from the DEFAULT branch. Changes here have no
    # effect on the cron until they are on that branch.
    - cron: '0 2 * * *'

# GITHUB_TOKEN is the pipeline's own credential: `packages: write` lets it push to
# ghcr.io/<owner>/<repo>, with no PAT to provision or rotate.
permissions:
  contents: read
  packages: write

# One mirror at a time. Two concurrent runs would race on the same cache keys and could
# both build the same version; queueing rather than cancelling lets a long run finish.
concurrency:
  group: fpm-mirror
  cancel-in-progress: false

jobs:
  # One cheap job decides the shards and produces the binary they all share, so the CLI
  # is obtained once rather than once per app.
  plan:
    name: Plan Shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tier0: ${{ steps.list.outputs.tier0 }}
      tier1: ${{ steps.list.outputs.tier1 }}
      tier1_any: ${{ steps.list.outputs.tier1_any }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ inputs.build_from_source }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The CLI is a released artifact — there is no reason for a nightly run to compile
      # it. The checksum published beside it is verified, so a corrupted or substituted
      # download fails here rather than halfway through a publish.
      #
      # The trade-off is deliberate: a change to mirror or packaging code only reaches
      # this workflow once it is released. build_from_source=true validates an
      # unreleased change.
      - name: Obtain FPM CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin
          if [ "${{ inputs.build_from_source }}" = "true" ]; then
            echo "Compiling from ${{ github.ref_name }}."
            make build
          else
            tmp="$(mktemp -d)"
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern 'fpm-linux-amd64' --pattern 'fpm-linux-amd64.sha256' --dir "$tmp"
            ( cd "$tmp" && sha256sum -c fpm-linux-amd64.sha256 )
            install -m 0755 "$tmp/fpm-linux-amd64" bin/fpm
            rm -rf "$tmp"
          fi
          ./bin/fpm --version

      - name: Share the CLI with the shards
        uses: actions/upload-artifact@v4
        with:
          name: fpm-cli
          path: bin/fpm
          retention-days: 1

      # The shard list comes from the CLI rather than from parsing the CSV here, so which
      # apps are enabled has exactly one implementation. --list-slugs needs no repository,
      # credentials or network.
      - name: List Catalog Shards
        id: list
        run: |
          ARGS="--list-slugs --catalog catalog/apps.csv"
          if [ -n "${{ inputs.apps }}" ]; then
            ARGS="$ARGS --apps ${{ inputs.apps }}"
          fi
          if [ "${{ inputs.allow_third_party }}" = "true" ]; then
            ARGS="$ARGS --allow-third-party=true"
          fi
          # Two waves. Everything in tier 0 is published before tier 1 starts, because
          # an app whose required_apps name other catalog entries can only pin them —
          # and hang its OCI referrers subject off them — once they are in the registry.
          # hrms needs erpnext; webshop needs erpnext and payments.
          T0="$(./bin/fpm mirror $ARGS --tier 0)"
          T1="$(./bin/fpm mirror $ARGS --tier 1)"
          echo "tier 0: $T0"
          echo "tier 1: $T1"
          echo "tier0=$T0" >> "$GITHUB_OUTPUT"
          echo "tier1=$T1" >> "$GITHUB_OUTPUT"
          # A matrix cannot be empty, so the dependents job is skipped when tier 1 is.
          if [ "$T1" = "[]" ]; then echo "tier1_any=false"; else echo "tier1_any=true"; fi >> "$GITHUB_OUTPUT"

  # One runner per app. Wall time becomes the slowest single app rather than the sum of
  # all of them, and each shard gets a whole runner's memory and disk — a Vite build of a
  # frappe-ui app wants ~4 GB and its node_modules alone can approach a gigabyte, so
  # several of them on one runner is what would run it out of space.
  #
  # Sharding by app, never finer: every version of one app shares a single checkout in
  # the build cache, and `git checkout -f` + `git clean -fdx` on a tree another build is
  # reading would corrupt it. Versions stay sequential within their shard.
  mirror:
    name: mirror ${{ matrix.slug }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One app failing must not cancel the others; the summary job collects every
      # result and fails the run at the end.
      fail-fast: false
      # Bounded so a full catalog does not saturate the account's runner allowance.
      max-parallel: 6
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.tier0) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip wheel
          npm install -g yarn pnpm   # drive builds with pnpm, helpdesk and crm with yarn

      # "no space left on device" reads like a build error rather than a capacity one,
      # so reclaim what this job never uses.
      - name: Free Disk Space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          echo "After:"; df -h / | tail -1

      - name: Fetch the shared CLI
        uses: actions/download-artifact@v4
        with:
          name: fpm-cli
          path: bin

      - name: Make it executable
        run: |
          chmod +x bin/fpm   # artifacts do not preserve the exec bit
          ./bin/fpm --version

      # Restore and save are separate on purpose. The combined actions/cache action only
      # writes its cache when the job SUCCEEDS, so a failed shard threw away everything it
      # had fetched and the next run started cold. `cache/save` with `if: always()` keeps
      # the clone and package-manager caches either way.
      #
      # Keyed per app: a shard restores one app's cache instead of the whole catalog's,
      # and one app's churn cannot invalidate another's. The catalog is deliberately not
      # in the key — it says which apps to build, not what a clone or an npm tarball holds.
      - name: Restore Build Cache
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.fpm/build-cache
          key: fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-

      - name: Report Cache State
        run: |
          echo "Restored from: ${{ steps.restore-build-cache.outputs.cache-matched-key || 'nothing (cold shard)' }}"
          du -sh ~/.fpm/build-cache/* 2>/dev/null || true

      # Two backends, one build. GHCR is always configured — it needs no secret beyond the
      # pipeline's own GITHUB_TOKEN. The HTTP FPM registry is added only when its URL is
      # configured, so a fork without one still mirrors to GHCR.
      - name: Configure Repositories
        id: repos
        env:
          FPM_HTTP_URL: ${{ vars.FPM_REGISTRY_URL }}
          FPM_HTTP_USER: ${{ secrets.FPM_REGISTRY_USERNAME }}
        run: |
          ./bin/fpm repo add ghcr ghcr.io/${{ github.repository }} --type oci --username ${{ github.actor }}
          REPO_ARGS="--repo ghcr"

          if [ -n "$FPM_HTTP_URL" ]; then
            ./bin/fpm repo add fpm-http "$FPM_HTTP_URL" --type http --username "${FPM_HTTP_USER:-fpm}"
            REPO_ARGS="$REPO_ARGS --repo fpm-http"
            echo "Mirroring to GHCR (oci) and $FPM_HTTP_URL (http)."
          else
            echo "FPM_REGISTRY_URL is not set; mirroring to GHCR (oci) only."
          fi

          echo "repo_args=$REPO_ARGS" >> "$GITHUB_OUTPUT"
          ./bin/fpm repo list

      - name: Run FPM Mirror
        env:
          # fpm reads the password for repository <name> from FPM_REPO_<NAME>_PASSWORD.
          # The repositories are added as "ghcr" and "fpm-http" above.
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          FPM_REPO_FPM_HTTP_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD }}
        run: |
          mkdir -p dist
          # --repo is repeatable: one build of each version, published to every backend.
          # --cache-dir is what makes a shard cheap: the app's checkout lives in
          # <cache>/src and is fetched rather than re-cloned, and pip, npm and yarn are
          # pointed at <cache>/{pip,npm} for every build subprocess.
          ARGS="${{ steps.repos.outputs.repo_args }} --apps ${{ matrix.slug }}"
          ARGS="$ARGS --catalog catalog/apps.csv --python-version 3.11"
          ARGS="$ARGS --cache-dir $HOME/.fpm/build-cache --output-path dist"
          ARGS="$ARGS --report dist/mirror-report-${{ matrix.slug }}.json"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: ./bin/fpm mirror $ARGS"
          ./bin/fpm mirror $ARGS

      # Publishing returning 0 is not the same as the registry serving the artifact.
      # This reads every version the shard claims to have published back out of the
      # registry's own metadata, so "published" means retrievable rather than merely
      # uploaded. Skipped on a dry run, which publishes nothing.
      - name: Verify Published Versions Are Retrievable
        if: ${{ inputs.dry_run != true }}
        env:
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          FPM_REPO_FPM_HTTP_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD }}
        run: |
          REPORT="dist/mirror-report-${{ matrix.slug }}.json"
          [ -f "$REPORT" ] || { echo "no report to verify"; exit 0; }

          # Every version this shard says is in the registry, published now or already
          # there, must answer to a metadata query.
          REPORT="$REPORT" python3 - > /tmp/to-verify <<'EXTRACT'
          import json, os
          live = {"published", "published-nodeps", "skipped-exists"}
          for r in json.load(open(os.environ["REPORT"])):
              if r.get("action") in live:
                  print(r.get("app_name") or r["slug"], r["version"])
          EXTRACT

          if [ ! -s /tmp/to-verify ]; then
            echo "Nothing was published by this shard; nothing to verify."
            exit 0
          fi

          rc=0
          while read -r app version; do
            if ./bin/fpm exists "frappe/$app==$version" --remote >/dev/null 2>&1; then
              echo "  ✓ frappe/$app==$version is in the registry"
            else
              echo "  ✗ frappe/$app==$version was reported published but is NOT retrievable" >&2
              rc=1
            fi
          done < /tmp/to-verify
          exit $rc

      - name: Save Build Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.fpm/build-cache
          key: fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-${{ github.run_id }}

      # dist/ is deliberately not cached — it is this run's output, and restoring stale
      # .fpm files into it would be actively wrong. The report is uploaded instead.
      - name: Upload Shard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpm-mirror-report-${{ matrix.slug }}
          path: dist/mirror-report-${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 14

  mirror-dependents:
    name: mirror ${{ matrix.slug }} (tier 1)
    needs: [plan, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skipped when nothing declares a tier, and run even if a tier 0 app failed: an
    # unrelated failure there must not withhold every dependent app.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.tier1_any == 'true' }}
    strategy:
      # One app failing must not cancel the others; the summary job collects every
      # result and fails the run at the end.
      fail-fast: false
      # Bounded so a full catalog does not saturate the account's runner allowance.
      max-parallel: 6
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.tier1) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip wheel
          npm install -g yarn pnpm   # drive builds with pnpm, helpdesk and crm with yarn

      # "no space left on device" reads like a build error rather than a capacity one,
      # so reclaim what this job never uses.
      - name: Free Disk Space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          echo "After:"; df -h / | tail -1

      - name: Fetch the shared CLI
        uses: actions/download-artifact@v4
        with:
          name: fpm-cli
          path: bin

      - name: Make it executable
        run: |
          chmod +x bin/fpm   # artifacts do not preserve the exec bit
          ./bin/fpm --version

      # Restore and save are separate on purpose. The combined actions/cache action only
      # writes its cache when the job SUCCEEDS, so a failed shard threw away everything it
      # had fetched and the next run started cold. `cache/save` with `if: always()` keeps
      # the clone and package-manager caches either way.
      #
      # Keyed per app: a shard restores one app's cache instead of the whole catalog's,
      # and one app's churn cannot invalidate another's. The catalog is deliberately not
      # in the key — it says which apps to build, not what a clone or an npm tarball holds.
      - name: Restore Build Cache
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.fpm/build-cache
          key: fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-

      - name: Report Cache State
        run: |
          echo "Restored from: ${{ steps.restore-build-cache.outputs.cache-matched-key || 'nothing (cold shard)' }}"
          du -sh ~/.fpm/build-cache/* 2>/dev/null || true

      # Two backends, one build. GHCR is always configured — it needs no secret beyond the
      # pipeline's own GITHUB_TOKEN. The HTTP FPM registry is added only when its URL is
      # configured, so a fork without one still mirrors to GHCR.
      - name: Configure Repositories
        id: repos
        env:
          FPM_HTTP_URL: ${{ vars.FPM_REGISTRY_URL }}
          FPM_HTTP_USER: ${{ secrets.FPM_REGISTRY_USERNAME }}
        run: |
          ./bin/fpm repo add ghcr ghcr.io/${{ github.repository }} --type oci --username ${{ github.actor }}
          REPO_ARGS="--repo ghcr"

          if [ -n "$FPM_HTTP_URL" ]; then
            ./bin/fpm repo add fpm-http "$FPM_HTTP_URL" --type http --username "${FPM_HTTP_USER:-fpm}"
            REPO_ARGS="$REPO_ARGS --repo fpm-http"
            echo "Mirroring to GHCR (oci) and $FPM_HTTP_URL (http)."
          else
            echo "FPM_REGISTRY_URL is not set; mirroring to GHCR (oci) only."
          fi

          echo "repo_args=$REPO_ARGS" >> "$GITHUB_OUTPUT"
          ./bin/fpm repo list

      - name: Run FPM Mirror
        env:
          # fpm reads the password for repository <name> from FPM_REPO_<NAME>_PASSWORD.
          # The repositories are added as "ghcr" and "fpm-http" above.
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          FPM_REPO_FPM_HTTP_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD }}
        run: |
          mkdir -p dist
          # --repo is repeatable: one build of each version, published to every backend.
          # --cache-dir is what makes a shard cheap: the app's checkout lives in
          # <cache>/src and is fetched rather than re-cloned, and pip, npm and yarn are
          # pointed at <cache>/{pip,npm} for every build subprocess.
          ARGS="${{ steps.repos.outputs.repo_args }} --apps ${{ matrix.slug }}"
          ARGS="$ARGS --catalog catalog/apps.csv --python-version 3.11"
          ARGS="$ARGS --cache-dir $HOME/.fpm/build-cache --output-path dist"
          ARGS="$ARGS --report dist/mirror-report-${{ matrix.slug }}.json"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: ./bin/fpm mirror $ARGS"
          ./bin/fpm mirror $ARGS

      # Publishing returning 0 is not the same as the registry serving the artifact.
      # This reads every version the shard claims to have published back out of the
      # registry's own metadata, so "published" means retrievable rather than merely
      # uploaded. Skipped on a dry run, which publishes nothing.
      - name: Verify Published Versions Are Retrievable
        if: ${{ inputs.dry_run != true }}
        env:
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          FPM_REPO_FPM_HTTP_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD }}
        run: |
          REPORT="dist/mirror-report-${{ matrix.slug }}.json"
          [ -f "$REPORT" ] || { echo "no report to verify"; exit 0; }

          # Every version this shard says is in the registry, published now or already
          # there, must answer to a metadata query.
          REPORT="$REPORT" python3 - > /tmp/to-verify <<'EXTRACT'
          import json, os
          live = {"published", "published-nodeps", "skipped-exists"}
          for r in json.load(open(os.environ["REPORT"])):
              if r.get("action") in live:
                  print(r.get("app_name") or r["slug"], r["version"])
          EXTRACT

          if [ ! -s /tmp/to-verify ]; then
            echo "Nothing was published by this shard; nothing to verify."
            exit 0
          fi

          rc=0
          while read -r app version; do
            if ./bin/fpm exists "frappe/$app==$version" --remote >/dev/null 2>&1; then
              echo "  ✓ frappe/$app==$version is in the registry"
            else
              echo "  ✗ frappe/$app==$version was reported published but is NOT retrievable" >&2
              rc=1
            fi
          done < /tmp/to-verify
          exit $rc

      - name: Save Build Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.fpm/build-cache
          key: fpm-mirror-buildcache-v2-${{ runner.os }}-${{ matrix.slug }}-${{ github.run_id }}

      # dist/ is deliberately not cached — it is this run's output, and restoring stale
      # .fpm files into it would be actively wrong. The report is uploaded instead.
      - name: Upload Shard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpm-mirror-report-${{ matrix.slug }}
          path: dist/mirror-report-${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 14

  # fail-fast is off so every shard reports, which means the matrix's status alone would
  # hide a failure. This job turns the shards back into a single pass/fail and one table.
  summary:
    name: Summarise
    needs: [mirror, mirror-dependents]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect Shard Reports
        uses: actions/download-artifact@v4
        with:
          pattern: fpm-mirror-report-*
          path: reports
          merge-multiple: true

      - name: Summarise
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, collections, sys

          results = []
          for path in sorted(glob.glob("reports/**/*.json", recursive=True)):
              try:
                  with open(path) as f:
                      loaded = json.load(f)
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"could not read {path}: {exc}", file=sys.stderr)
                  continue
              # WriteReport emits a top-level array of per-app results.
              results.extend(loaded if isinstance(loaded, list) else [loaded])

          print("## fpm mirror\n")
          if not results:
              print("No shard produced a report.")
              sys.exit(1)

          counts = collections.Counter(r.get("action", "unknown") for r in results)
          print("| action | count |")
          print("|---|---:|")
          for action, n in sorted(counts.items()):
              print(f"| {action} | {n} |")

          print("\n| app | version | action | size | detail |")
          print("|---|---|---|---|---|")
          for r in sorted(results, key=lambda r: (r.get("slug", ""), r.get("version", ""))):
              raw = r.get("size_bytes") or 0
              size = f"{raw / (1 << 20):.1f}M" if raw else "-"
              detail = (r.get("detail") or "").splitlines()
              print(f"| {r.get('slug','?')} | {r.get('version','')} | {r.get('action','?')} "
                    f"| {size} | {detail[0] if detail else ''} |")

          failed = [r for r in results if r.get("action") == "failed"]
          if failed:
              print(f"\n**{len(failed)} of {len(results)} builds failed.**")
              sys.exit(1)
          print(f"\nAll {len(results)} builds succeeded.")
          PY

      # A shard that died before writing a report (infrastructure failure, timeout)
      # produces no rows above, so the matrix job's own status is checked too.
      - name: Fail if any shard errored
        if: ${{ needs.mirror.result != 'success' || (needs.mirror-dependents.result != 'success' && needs.mirror-dependents.result != 'skipped') }}
        run: |
          echo "Mirror shards did not all succeed (tier 0: ${{ needs.mirror.result }}, tier 1: ${{ needs.mirror-dependents.result }})." >&2
          exit 1
