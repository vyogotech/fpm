name: FPM Release Build
on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v0.1.0, v1.2.3, etc.
  workflow_dispatch: # Allows manual triggering
permissions:
  contents: write # Required to create releases and upload assets
jobs:
  build:
    name: Build FPM Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21.x' ] # Specify your project's Go version
        platform:
          - {os: 'linux', arch: 'amd64', ext: '', archive: 'tar.gz'}
          - {os: 'linux', arch: 'arm64', ext: '', archive: 'tar.gz'}
          - {os: 'darwin', arch: 'amd64', ext: '', archive: 'tar.gz'}
          - {os: 'darwin', arch: 'arm64', ext: '', archive: 'tar.gz'}
          - {os: 'windows', arch: 'amd64', ext: '.exe', archive: 'zip'}
          # Add other platforms if needed, e.g., windows/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Set output names
        id: set_names
        shell: bash
        run: |
          binary_name="fpm${{ matrix.platform.ext }}"
          archive_name="fpm-${{ matrix.platform.os }}-${{ matrix.platform.arch }}"
          echo "binary_name=${binary_name}" >> $GITHUB_OUTPUT
          echo "archive_name=${archive_name}" >> $GITHUB_OUTPUT
      - name: Build FPM for ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
        env:
          GOOS: ${{ matrix.platform.os }}
          GOARCH: ${{ matrix.platform.arch }}
        run: |
          echo "Building for $GOOS/$GOARCH..."
          go build -v -o ${{ steps.set_names.outputs.binary_name }} ./cmd/fpm/main.go
          echo "Build complete: ${{ steps.set_names.outputs.binary_name }}"
      - name: Create archive
        shell: bash
        run: |
          if [ "${{ matrix.platform.archive }}" = "zip" ]; then
            zip ${{ steps.set_names.outputs.archive_name }}.zip ${{ steps.set_names.outputs.binary_name }}
            archive_file="${{ steps.set_names.outputs.archive_name }}.zip"
          else
            tar -czf ${{ steps.set_names.outputs.archive_name }}.tar.gz ${{ steps.set_names.outputs.binary_name }}
            archive_file="${{ steps.set_names.outputs.archive_name }}.tar.gz"
          fi
          echo "archive_file=${archive_file}" >> $GITHUB_ENV
          echo "Archive created: ${archive_file}"
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          sha256sum ${{ env.archive_file }} > ${{ env.archive_file }}.sha256
          echo "Checksum generated: ${{ env.archive_file }}.sha256"
          ls -l
      - name: Upload FPM binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpm-binaries-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: |
            ${{ env.archive_file }}
            ${{ env.archive_file }}.sha256
          retention-days: 7
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: fpm-release-assets/
      - name: List downloaded artifacts for debugging
        run: ls -R fpm-release-assets/
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release of FPM version ${{ github.ref_name }}. Please see CHANGELOG.md for details."
          draft: false
          prerelease: false
          files: |
            fpm-release-assets/*/*
