name: CI

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests with gotestsum
        run: |
          $(go env GOPATH)/bin/gotestsum --junitfile unit-tests.xml -- ./... -race -coverprofile=coverage.out

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: unit-tests.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build FPM using Makefile
        run: make build

      - name: Verify binary
        run: |
          ./bin/fpm --help

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

  validate-deployment:
    name: Validate Deployment Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          files=(
            "compose.yml"
            "nginx/nginx.conf"
            "nginx/fpm-location.conf"
            "scripts/setup.sh"
            "scripts/add-user.sh"
            "fpm-repo-README.md"
            "QUICK_START.md"
            ".env.example"
          )
          
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

      - name: Validate script permissions
        run: |
          if [ ! -x scripts/setup.sh ]; then
            echo "❌ scripts/setup.sh is not executable"
            exit 1
          fi
          if [ ! -x scripts/add-user.sh ]; then
            echo "❌ scripts/add-user.sh is not executable"
            exit 1
          fi
          echo "✓ Scripts have correct permissions"

      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $(pwd)/nginx/fpm-location.conf:/etc/nginx/fpm-location.conf:ro \
            nginx:alpine nginx -t

      - name: Validate compose file
        run: |
          docker compose -f compose.yml config > /dev/null
          echo "✓ compose.yml is valid"

      # Boots real nginx and asserts that every write path demands credentials
      # and that reads still carry CORS. See
      # test/registry/features/registry_auth.feature.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Registry write-protection acceptance tests
        run: go test -tags integration -count=1 -v ./test/registry/...

  offline-integration:
    name: SNE Offline Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # DIAGNOSTIC (temporary): identify which user-namespace mapping this runner
      # will accept. The suite dies in its package phase — the first podman call
      # that passes --userns — with:
      #   OCI runtime error: crun: writing file `/proc/<pid>/gid_map`: Invalid argument
      #
      # Already ruled out: missing subid ranges. The runner ships
      # runner:165536:65536 in BOTH /etc/subuid and /etc/subgid, and adding a
      # second range changed nothing.
      #
      # Every probe is non-fatal so one run reports all of them instead of
      # stopping at the first failure.
      - name: Probe user-namespace mappings
        run: |
          set -x
          id
          podman version --format '{{.Client.Version}}'
          grep -E "^$(id -un):" /etc/subuid /etc/subgid || true
          podman info --format 'rootless={{.Host.Security.Rootless}} idmaps={{.Host.IDMappings}}' || true
          ls -l /usr/bin/newuidmap /usr/bin/newgidmap || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          podman unshare cat /proc/self/uid_map /proc/self/gid_map || true

          probe() {
            echo "=== PROBE: $* ==="
            if podman run --rm "$@" docker.io/library/alpine:3 id; then
              echo "RESULT ok: $*"
            else
              echo "RESULT FAIL: $*"
            fi
          }
          probe --userns=keep-id
          probe --userns=keep-id:uid=1001,gid=0
          probe --userns=keep-id:uid=1001
          probe --userns=keep-id:gid=0
          probe --user 1001:0
          probe --userns=host --user 1001:0
          echo "=== probe summary ==="
          true

      - name: Run SNE Integration Test Suite
        run: |
          FPM_OFFLINE_LOCAL=1 ./test/offline/run.sh all

      - name: Upload SNE Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sne-offline-results
          path: test/offline/.work/local/out/

