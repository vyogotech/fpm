apiVersion: v1
kind: Service
metadata:
  name: {{ include "fpm-registry.fullname" . }}
  labels:
    {{- include "fpm-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "fpm-registry.selectorLabels" . | nindent 4 }}
