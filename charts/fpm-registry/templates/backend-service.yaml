{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fpm-registry.backendName" . }}
  labels:
    {{- include "fpm-registry.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fpm-registry.backendSelectorLabels" . | nindent 4 }}
{{- end }}
