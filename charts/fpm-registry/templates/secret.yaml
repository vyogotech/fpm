{{- if and .Values.auth.enabled (empty .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fpm-registry.fullname" . }}-auth
  labels:
    {{- include "fpm-registry.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.htpasswd }}
  .htpasswd: {{ .Values.auth.htpasswd | b64enc | quote }}
  {{- else }}
  {{- /*
    Fail the render rather than fall back to a default credential. A registry
    that ships with a well-known publish password is worse than one that fails
    to install, because that failure is silent and permanent.
  */}}
  .htpasswd: {{ htpasswd
      (required "auth.username is required unless auth.existingSecret or auth.htpasswd is set" .Values.auth.username)
      (required "auth.password is required unless auth.existingSecret or auth.htpasswd is set" .Values.auth.password)
    | b64enc | quote }}
  {{- end }}
{{- end }}
